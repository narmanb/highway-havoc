name: Tests and Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platform-tools platforms;android-34"

      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*.apk' 'templates/version.txt' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Import project
        run: godot --headless --editor --quit || true

      - name: Logic tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Touch controls test
        run: godot --headless --path . --fixed-fps 60 res://tests/touch_test.tscn

      - name: Bot playtest
        run: godot --headless --path . --fixed-fps 60 res://tests/bot_playtest.tscn

      - name: Configure Android export (debug keystore)
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HighwayHavoc.apk
          test -s build/HighwayHavoc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HighwayHavoc-apk
          path: build/HighwayHavoc.apk
